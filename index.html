<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS - Flores Timur</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Font Awesome (ikon untuk Awesome Markers) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Leaflet Awesome Markers CSS -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css" />

    <style>
        html,
        body,
        #map {
            width: 100%;
            height: calc(100vh - 56px);
            margin: 0;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Flores Timur</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://florestimurkab.go.id/" target="_blank"><i
                                class="fa-solid fa-link"></i>
                            Flores-Timur</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal"><i
                                class="fa-solid fa-circle-info"></i> About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Modal About -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="aboutModalLabel">About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped table-borderless m-0">
                        <tbody>
                            <tr>
                                <th scope="row" style="width: 25%;">Nama</th>
                                <td style="width: 5%;">:</td>
                                <td>Qorin Dienastya</td>
                            </tr>
                            <tr>
                                <th scope="row">NIM</th>
                                <td>:</td>
                                <td>25/560382/SV/26432</td>
                            </tr>
                            <tr>
                                <th scope="row">Kelas</th>
                                <td>:</td>
                                <td>A</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Feature / Detail -->
    <div class="modal fade" id="featureModal" tabindex="-1" aria-labelledby="featureModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="featureModalTitle">Detail</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="featureModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Leaflet Awesome Markers JS -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.min.js"></script>

    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.3554928, 122.9933167], 11);

        // Map Panes
        map.createPane('pane_jalan');
        map.getPane('pane_jalan').style.zIndex = 400;

        map.createPane('pane_jumlah_penduduk');
        map.getPane('pane_jumlah_penduduk').style.zIndex = 300;

        // Tile Layer Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });
        basemap.addTo(map);

        // Fungsi untuk menentukan Awesome Marker berdasarkan NAMA_UNSUR
        function getAwesomeIcon(namaUnsur) {
            var iconName = "location-dot";
            var markerColor = "blue";

            switch (namaUnsur) {
                case "Gunung":
                    iconName = "mountain";
                    markerColor = "red";
                    break;
                case "Tanjung":
                    iconName = "umbrella-beach";
                    markerColor = "orange";
                    break;
                case "Teluk":
                    iconName = "water";
                    markerColor = "darkblue";
                    break;
                case "Toponimi":
                default:
                    iconName = "location-dot";
                    markerColor = "green";
                    break;
            }

            return L.AwesomeMarkers.icon({
                icon: iconName,
                prefix: 'fa',
                markerColor: markerColor,
                iconColor: 'white'
            });
        }

        // GeoJSON Point Toponimi menggunakan Leaflet.awesome-markers
        var toponimi = L.geoJSON(null, {
            pointToLayer: function (feature, latlng) {
                var unsur = feature.properties.NAMA_UNSUR;
                return L.marker(latlng, {
                    icon: getAwesomeIcon(unsur)
                });
            },
            onEachFeature: function (feature, layer) {
                var imageHtml = feature.properties.image
                    ? "<img src='images/" + feature.properties.image + "' alt='' width='200' class='mb-2 rounded'><br>"
                    : "";

                var popup_content = imageHtml +
                    "<strong>Nama:</strong> " + feature.properties.TOPONIMI + "<br>" +
                    "<strong>Unsur:</strong> " + feature.properties.NAMA_UNSUR + "<br>" +
                    "<strong>Koordinat:</strong> " + feature.geometry.coordinates[1].toFixed(5) + ", " + feature.geometry.coordinates[0].toFixed(5);

                layer.on({
                    click: function (e) {
                        layer.bindPopup(popup_content).openPopup();
                    },
                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.TOPONIMI, {
                            direction: "top",
                            sticky: true
                        });
                    }
                });
            }
        });

        // GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {
            pane: 'pane_jalan',
            style: function (feature) {
                if (feature.properties.NAMA_UNSUR === "Jalan Propinsi") {
                    return { pane: 'pane_jalan', color: "red", weight: 3 };
                }
                if (feature.properties.NAMA_UNSUR === "Jalan Kabupaten") {
                    return { pane: 'pane_jalan', color: "red", weight: 2, dashArray: "10, 10" };
                }
                if (feature.properties.NAMA_UNSUR === "Jalan Lain") {
                    return { pane: 'pane_jalan', color: "red", weight: 1, dashArray: "4, 6" };
                }
                return { pane: 'pane_jalan', color: "red", weight: 1 };
            },
            onEachFeature: function (feature, layer) {
                var popup_content = "Fungsi: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Panjang (km): " + feature.properties.panjang_km;

                layer.on({
                    click: function (e) {
                        layer.bindPopup(popup_content).openPopup();
                    },
                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.NAMA_UNSUR, {
                            direction: "auto",
                            sticky: true
                        });
                    }
                });
            }
        });

        // GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            pane: 'pane_jumlah_penduduk',
            style: function (feature) {
                if (feature.properties.Penduduk <= 12000) {
                    return { pane: 'pane_jumlah_penduduk', opacity: 1, color: 'black', weight: 1.0, fillOpacity: 0.5, fillColor: '#ffffb2' };
                }
                if (feature.properties.Penduduk > 12000 && feature.properties.Penduduk <= 24000) {
                    return { pane: 'pane_jumlah_penduduk', opacity: 1, color: 'black', weight: 1.0, fillOpacity: 0.5, fillColor: '#fd8d3c' };
                }
                if (feature.properties.Penduduk > 24000) {
                    return { pane: 'pane_jumlah_penduduk', opacity: 1, color: 'black', weight: 1.0, fillOpacity: 0.5, fillColor: '#bd0026' };
                }
            },
            onEachFeature: function (feature, layer) {
                var popup_content = "<table class='table table-striped table-bordered m-0'>" +
                    "<tr><th>Kecamatan</th><td>" + feature.properties.WADMKC + "</td></tr>" +
                    "<tr><th>Jumlah Penduduk</th><td>" + feature.properties.Penduduk + "</td></tr>" +
                    "<tr><th>Luas Wilayah</th><td>" + feature.properties.luas_km2 + " km²</td></tr>" +
                    "</table>";

                layer.on({
                    click: function (e) {
                        $("#featureModalTitle").html("Kecamatan " + feature.properties.WADMKC);
                        $("#featureModalBody").html(popup_content);
                        $("#featureModal").modal("show");
                    },
                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.WADMKC, {
                            direction: "auto",
                            sticky: true
                        });
                    }
                });
            }
        });

        // Load GeoJSON Data
        $.getJSON("geojson/jumlah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data);
            map.addLayer(jumlah_penduduk);
        });

        $.getJSON("geojson/toponimi.geojson", function (data) {
            toponimi.addData(data);
            map.addLayer(toponimi);
        });

        $.getJSON("geojson/jalan.geojson", function (data) {
            jalan.addData(data);
            map.addLayer(jalan);
        });

        // Control Layer & Legenda
        var baseMaps = {
            "OpenStreetMap": basemap,
        };

        var legenda_jalan = "Jalan<br>" +
            "<svg width='20' height='6' style='vertical-align: middle; margin-left: 18px; margin-right: 5px;'><line x1='0' y1='3' x2='20' y2='3' stroke='red' stroke-width='3'/></svg> Jalan Propinsi<br>" +
            "<svg width='20' height='6' style='vertical-align: middle; margin-left: 18px; margin-right: 5px;'><line x1='0' y1='3' x2='20' y2='3' stroke='red' stroke-width='2' stroke-dasharray='7, 4'/></svg> Jalan Kabupaten<br>" +
            "<svg width='20' height='6' style='vertical-align: middle; margin-left: 18px; margin-right: 5px;'><line x1='0' y1='3' x2='20' y2='3' stroke='red' stroke-width='1' stroke-dasharray='4, 4'/></svg> Jalan Lain";

        var legenda_penduduk = "Jumlah Penduduk<br>" +
            "<span style='display: inline-block; width: 15px; height: 15px; background-color: #ffffb2; border: 1px solid #000; vertical-align: middle; margin-left: 18px; margin-right: 5px;'></span> &le; 12.000 jiwa<br>" +
            "<span style='display: inline-block; width: 15px; height: 15px; background-color: #fd8d3c; border: 1px solid #000; vertical-align: middle; margin-left: 18px; margin-right: 5px;'></span> 12.001 - 24.000 jiwa<br>" +
            "<span style='display: inline-block; width: 15px; height: 15px; background-color: #bd0026; border: 1px solid #000; vertical-align: middle; margin-left: 18px; margin-right: 5px;'></span> &gt; 24.000 jiwa";

        // Legenda kustom untuk Toponimi
        var legenda_toponimi = "Toponimi<br>" +
            "<i class='fa-solid fa-mountain' style='color: red; width: 20px; text-align: center; margin-left: 18px; margin-right: 5px;'></i> Gunung<br>" +
            "<i class='fa-solid fa-umbrella-beach' style='color: orange; width: 20px; text-align: center; margin-left: 18px; margin-right: 5px;'></i> Tanjung<br>" +
            "<i class='fa-solid fa-water' style='color: darkblue; width: 20px; text-align: center; margin-left: 18px; margin-right: 5px;'></i> Teluk<br>" +
            "<i class='fa-solid fa-location-dot' style='color: green; width: 20px; text-align: center; margin-left: 18px; margin-right: 5px;'></i> Toponimi Lain";

        var overlayMaps = {
            [legenda_toponimi]: toponimi,
            [legenda_jalan]: jalan,
            [legenda_penduduk]: jumlah_penduduk,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps, { collapsed: false });
        controllayer.addTo(map);

        // Scale Bar
        L.control.scale({
            metric: true,
            imperial: false,
        }).addTo(map);
    </script>
</body>

</html>
